<!doctype html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secret Santa</title>
<style>
:root{--bg:#f4c2bf;--card:#fff;--ink:#222;--mute:#666;--blue:#2a6df4;--red:#c4372b;--line:#e6e6e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:1.7rem;margin:.2em 0 .1em}h2{font-size:1.1rem;margin:0 0 .6em}
.card{background:var(--card);border-radius:14px;padding:18px;margin:14px 0}
.mute{color:var(--mute)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{background:#f3f3f3;border-radius:8px;padding:8px 12px;margin:6px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}
input,select,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid #bbb}
input,select{flex:1;min-width:120px}
button{background:var(--blue);color:#fff;border:0;cursor:pointer;font-weight:600}
button.alt{background:#fff;color:var(--blue);border:1px solid var(--blue)}
button.x{background:none;color:var(--red);padding:2px 8px;font-size:1.2rem}
button.danger{background:var(--red)}
:focus-visible{outline:3px solid #111;outline-offset:2px}
.err{color:var(--red);font-weight:600;min-height:1.3em}
.reveal{text-align:center;padding:26px 10px}.reveal b{display:block;font-size:2rem;margin:.3em 0}
a{color:var(--blue)}label.chk{display:flex;gap:6px;align-items:center}label.chk input{flex:none;min-width:0}
</style>
</head>
<body><main id="app">Loading…</main>
<script>
const app=document.getElementById('app');
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){k.startsWith('on')?e.addEventListener(k.slice(2),a[k]):k==='class'?e.className=a[k]:e.setAttribute(k,a[k])}e.append(...c.flat().filter(x=>x!=null&&x!==false));return e};
async function api(path,o={}){
  const k=localStorage.adminKey;
  const r=await fetch('/api/'+path,{method:o.method||(o.body?'POST':'GET'),
    headers:{'content-type':'application/json',...(k?{'x-admin-key':k}:{})},body:o.body?JSON.stringify(o.body):undefined});
  const d=await r.json();if(!r.ok)throw new Error(d.error||'Something went wrong');return d}
const safeLink=u=>/^https?:\/\//i.test(u||'');
const wishItem=(w,del)=>h('div',{class:'pill'},h('span',{},safeLink(w.url)?h('a',{href:w.url,target:'_blank',rel:'noopener noreferrer'},w.title):w.title),del?h('button',{class:'x','aria-label':'Remove '+w.title,onclick:()=>del(w)},'×'):null);
const head=pub=>h('div',{class:'card'},h('h1',{},pub.settings.name),
  h('div',{class:'mute'},[pub.settings.date&&'Gift exchange: '+pub.settings.date,pub.settings.budget&&'Budget: '+pub.settings.budget].filter(Boolean).join(' · ')));
const err=h('div',{class:'err',role:'alert'});
const guard=fn=>async(...a)=>{err.textContent='';try{await fn(...a)}catch(e){err.textContent=e.message}};

async function participant(){
  const pub=await api('public'),me=+localStorage.me,who=pub.members.find(m=>m.id===me);
  if(!who){
    const sel=h('select',{'aria-label':'Your name'},h('option',{value:''},'Choose your name'),pub.members.map(m=>h('option',{value:m.id},m.name)));
    app.replaceChildren(head(pub),h('div',{class:'card'},h('h2',{},'Who are you?'),
      pub.members.length?h('div',{class:'row'},sel,h('button',{onclick:()=>{if(sel.value){localStorage.me=sel.value;participant()}}},'Continue')):h('p',{class:'mute'},'The organiser hasn\u2019t added anyone yet. Check back soon.')));
    return}
  const wl=h('div'),box=h('div',{class:'card'});
  const loadWishes=async()=>{const w=await api('wishes/'+me);wl.replaceChildren(...(w.length?w.map(x=>wishItem(x,guard(async x=>{await api('wishes/'+x.id+'?member='+me,{method:'DELETE'});loadWishes()}))):[h('p',{class:'mute'},'Add a few ideas so your Secret Santa knows what you\u2019d like.')]))};
  const t=h('input',{placeholder:'Gift idea','aria-label':'Gift idea'}),l=h('input',{placeholder:'Link (optional)','aria-label':'Link',inputmode:'url'});
  const add=guard(async()=>{await api('wishes',{body:{memberId:me,title:t.value,url:l.value}});t.value=l.value='';loadWishes()});
  const draw=h('div',{class:'card'});
  if(pub.drawn){
    draw.append(h('div',{class:'reveal'},h('button',{onclick:guard(async()=>{
      const a=await api('assignment/'+me);
      draw.replaceChildren(h('div',{class:'reveal'},h('span',{class:'mute'},'You are the Secret Santa for'),h('b',{},a.name)),
        h('h2',{},a.name+'\u2019s wish list'),...(a.wishes.length?a.wishes.map(w=>wishItem(w)):[h('p',{class:'mute'},'They haven\u2019t added any gifts yet. Check back later.')]))})},'Reveal who I drew')))
  }else draw.append(h('p',{class:'mute'},'Names haven\u2019t been drawn yet. Add your wish list while you wait.'));
  box.append(h('h2',{},'My wish list'),wl,h('div',{class:'row'},t,l,h('button',{onclick:add},'Add')),err);
  app.replaceChildren(head(pub),h('div',{class:'card'},h('div',{class:'row'},h('span',{},'Hi '+who.name+'!'),h('button',{class:'alt',onclick:()=>{delete localStorage.me;participant()}},'Not you?'))),draw,box);
  loadWishes()}

async function admin(){
  if(!localStorage.adminKey){
    const k=h('input',{type:'password',placeholder:'Admin password','aria-label':'Admin password'});
    app.replaceChildren(h('div',{class:'card'},h('h2',{},'Organiser login'),h('div',{class:'row'},k,h('button',{onclick:()=>{localStorage.adminKey=k.value;admin()}},'Log in')),err));return}
  let d;try{d=await api('admin')}catch(e){delete localStorage.adminKey;err.textContent=e.message;return admin()}
  const nm=Object.fromEntries(d.members.map(m=>[m.id,m.name])),re=()=>admin();
  const a=fn=>guard(async()=>{await fn();re()});
  const sn=h('input',{value:d.settings.name,'aria-label':'Group name'}),sd=h('input',{value:d.settings.date,placeholder:'Date, e.g. 25 Dec 2026','aria-label':'Date'}),sb=h('input',{value:d.settings.budget,placeholder:'Budget, e.g. \u20B91,000','aria-label':'Budget'});
  const mn=h('input',{placeholder:'Participant name','aria-label':'Participant name'});
  const opts=ph=>[h('option',{value:''},ph),...d.members.map(m=>h('option',{value:m.id},m.name))];
  const eg=h('select',{'aria-label':'Giver'},opts('Giver')),er=h('select',{'aria-label':'Cannot draw'},opts('Cannot draw')),eb=h('input',{type:'checkbox',id:'both',checked:''});
  app.replaceChildren(
    h('div',{class:'card'},h('h1',{},'Organiser'),h('p',{class:'mute'},'Participant link: '+location.origin+'/'),err),
    h('div',{class:'card'},h('h2',{},'Event details'),h('div',{class:'row'},sn,sd,sb,h('button',{onclick:a(()=>api('admin/settings',{body:{name:sn.value,date:sd.value,budget:sb.value}}))},'Save'))),
    h('div',{class:'card'},h('h2',{},'Participants ('+d.members.length+')'),
      ...d.members.map(m=>h('div',{class:'pill'},m.name,d.drawn?null:h('button',{class:'x','aria-label':'Remove '+m.name,onclick:a(()=>api('admin/members/'+m.id,{method:'DELETE'}))},'×'))),
      d.drawn?null:h('div',{class:'row'},mn,h('button',{onclick:a(()=>api('admin/members',{body:{name:mn.value}}))},'Add'))),
    h('div',{class:'card'},h('h2',{},'Exclusions (only you can see these)'),
      ...d.exclusions.map(x=>h('div',{class:'pill'},nm[x.giver]+' can\u2019t draw '+nm[x.receiver],h('button',{class:'x','aria-label':'Remove exclusion',onclick:a(()=>api('admin/exclusions/'+x.giver+'/'+x.receiver,{method:'DELETE'}))},'×'))),
      d.drawn?null:h('div',{class:'row'},eg,er,h('label',{class:'chk'},eb,'Both ways'),h('button',{onclick:a(()=>api('admin/exclusions',{body:{giver:eg.value,receiver:er.value,both:eb.checked}}))},'Add'))),
    h('div',{class:'card'},h('h2',{},'Draw names'),
      d.drawn?h('div',{},h('p',{},'Names are drawn and locked. Participants can now reveal who they drew.'),h('button',{class:'danger',onclick:a(async()=>{if(confirm('This erases the current draw for everyone. Continue?'))await api('admin/reset',{method:'POST',body:{}})})},'Reset draw'))
        :h('div',{},h('p',{class:'mute'},'You won\u2019t see who drew whom, so you can play too.'),h('button',{onclick:a(()=>api('admin/draw',{body:{}}))},'Draw names'))));
}
location.hash==='#admin'?admin():participant();
window.addEventListener('hashchange',()=>location.reload());
</script></body></html>
