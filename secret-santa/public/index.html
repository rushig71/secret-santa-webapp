<!doctype html>
<html lang="en">
<head>
<!-- Browser tab icon -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="utf-8">
<!-- Makes the page fit phone screens properly -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secret Santa</title>

<!-- Google Fonts: Emilys Candy (the match name), Fraunces (headings, buttons), Inter (body text) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Emilys+Candy&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* Colour palette used across the whole page */
:root {
  --red: #c60b00;
  --ink: #000;
  --body: #2d2d2d;
  --green: #146827;
  --page: #f1f1f1;
  --field: rgba(241,241,241,.67);
}

/* Basic page setup: sizing, background, text and fonts */
* {
  box-sizing: border-box;
}
html,body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
}
body {
  font-family: Inter,system-ui,sans-serif;
  font-weight: 500;
  font-size: 16px;
  line-height: 1.4;
}
button,input,select,textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}

/* Page column: narrow and centred (wider for the organiser page) */
#app {
  max-width: 360px;
  margin: 0 auto;
  min-height: 100dvh;
}
#app.admin {
  max-width: 520px;
}

/* One "screen" = a full-height page area that decorations can be positioned inside */
.screen {
  position: relative;
  min-height: 100dvh;
  padding: 54px 16px 32px;
  overflow: hidden;
}
.screen.welcome {
  padding-top: 106px;
}
.screen.hub {
  padding-bottom: 170px;
}

/* Headings and text styles */
h1 {
  margin: 0;
  font-family: Fraunces,serif;
  font-weight: 600;
  font-size: 32px;
  line-height: 1.4;
  font-variation-settings: "SOFT" 0,"WONK" 1,"opsz" 32;
}
h2 {
  margin: 0;
  font-family: Fraunces,serif;
  font-weight: 600;
  font-size: 22px;
  line-height: 1.4;
  font-variation-settings: "SOFT" 0,"WONK" 1,"opsz" 22;
}
.lede {
  margin: 8px 0 0;
  color: var(--body);
}

/* The "Hi Name!" line on the participant page: 26px sits between the title (32px) and the
   card titles (22px). The "Not you?" button keeps its own 16px size (see .link below). */
.greeting {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  column-gap: 10px;
  font-size: 26px;
  line-height: 1.3;
}
.greeting strong {
  font-weight: 700;
}

/* Layout helpers: vertical stacks and the gaps between items */
.stack {
  display: flex;
  flex-direction: column;
}
.gap-29 {
  gap: 29px;
}
.gap-24 {
  gap: 24px;
}
.gap-16 {
  gap: 16px;
}
.gap-32 {
  gap: 32px;
}
.gap-8 {
  gap: 8px;
}

/* Narrow title so it does not run under the wreath */
.title-narrow {
  max-width: 233px;
}

/* White rounded cards */
.card {
  background: #fff;
  border-radius: 12px;
}
.card-pad {
  padding: 12px;
}

/* Form fields (text boxes and dropdowns) */
.field {
  display: flex;
  align-items: center;
  background: var(--field);
  border-radius: 12px;
  padding: 12px;
  border: 1px solid #e3e3e3;
}
.field input,.field select,.field textarea {
  width: 100%;
  border: 0;
  background: transparent;
  padding: 0;
  outline: none;
  font-weight: 500;
  line-height: 1.4;
}
.field textarea {

}
.field input::placeholder {

  opacity: 1;
}

/* Big red buttons (with snowflake decorations), plus small, outlined and dark variants */
.btn {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 64px;
  padding: 20px 44px;
  border: 0;
  border-radius: 16px;
  background: var(--red);
  color: #fff;
  overflow: hidden;
  font-family: Fraunces,serif;
  font-weight: 600;
  font-size: 26px;
  letter-spacing: -.52px;
  line-height: normal;
  font-variation-settings: "SOFT" 0,"WONK" 1,"opsz" 26;
}
.btn span {
  white-space: nowrap;
}
.btn .flake {

  top: 0;
  pointer-events: none;
}
.btn .flake-l {

}
.btn .flake-r {

}
.btn.sm {

  height: 46px;
  padding: 8px 20px;
  font-size: 18px;
  letter-spacing: -.2px;
  border-radius: 12px;

}
.btn.alt {

}

  background: #fffbf2;

  left: 50%;

  height: 100%;

.ribbon-h {
  position: absolute;

}
.wrapped-lock {

.wf2 { left: 87%; top: 19px; width: 22px; height: 22px; }
.wf3 { left: 12%; top: 114px; width: 20px; height: 20px; }

<body>
<!-- Everything on the page is drawn into this one element by the script below -->
<main id="app">Loading…</main>
<script>
// =====================================================================
// SMALL HELPERS
// =====================================================================

// "app" is the single container the whole page is drawn into.
// "A" is the folder that holds the images.
const app = document.getElementById('app'),
      A = '/assets/';

// h = "build an HTML element". Example: h('div', { class: 'card' }, 'Hello')
//   t = tag name, a = attributes/handlers, c = children (text or other elements).
// Attributes starting with "on" become event listeners (onclick -> click),
// "class" sets the CSS class, anything else becomes a normal attribute.
// null/undefined/false children are skipped, and nested lists are flattened.
const h = (t, a = {}, ...c) => {
  const e = document.createElement(t);
  for (const k in a) {
    k.startsWith('on')
      ? e.addEventListener(k.slice(2), a[k])
      : k === 'class'
        ? e.className = a[k]
        : e.setAttribute(k, a[k])
  }
  e.append(...c.flat().filter(x => x != null && x !== false));
  return e
};

// api = talk to the backend. Sends the saved admin password and/or the saved PIN (if any) with every call.
//   path = what comes after /api/, o = options (method, body).
// If the options include a body it is a POST, otherwise a GET unless a method is given.
// Throws an Error carrying the server's message when the response is not OK.
async function api(path, o = {}) {
  const k = localStorage.adminKey, pin = localStorage.pin;
  const r = await fetch('/api/' + path, {
    method: o.method || (o.body ? 'POST' : 'GET'),
    headers: { 'content-type': 'application/json', ...(k ? { 'x-admin-key': k } : {}), ...(pin ? { 'x-pin': pin } : {}) },
    body: o.body ? JSON.stringify(o.body) : undefined
  });
  const d = await r.json();
  if (!r.ok) {
    // Keep the server's short "code" (e.g. 'pin' = wrong or outdated PIN) so callers can react to it.
    const e = new Error(d.error || 'Something went wrong');
    e.code = d.code;
    throw e
  }
  return d
}

// The red error line shown on the page, and "guard" which wraps an action:
// it clears the old error first and shows any new error instead of crashing.
// If the server says the saved PIN is outdated, it sends the person back to the PIN screen.
const err = h('div', { class: 'err', role: 'alert' });
const guard = fn => async (...a) => {
  err.textContent = '';
  try { await fn(...a) }
  catch (e) {
    if (e.code === 'pin' && localStorage.pin) {
      // The saved PIN is no longer accepted (changed or reset elsewhere): forget it and ask again.
      delete localStorage.pin;
      await participant();
      err.textContent = 'Your PIN has changed. Please enter the new one.'
    }
    else err.textContent = e.message
  }
};


// =====================================================================
// SHARED LOOK (decorations, buttons, date badge, price banner, answer rows)
// =====================================================================

// A decorative image inside a box. "cls" picks which crop/position CSS to use.
const art = (cls, src) => h('div', { class: 'art ' + cls, 'aria-hidden': 'true' }, h('img', { src: A + src, alt: '' }));

// String lights drawn along the top of the date badge ("badge") or the price banner ("banner").
const lights = k => h('div', { class: 'lights lights-' + k, 'aria-hidden': 'true' }, h('img', { src: A + 'lights-' + k + '.svg', alt: '' }));

// A red button. Big buttons get snowflake decorations on both sides;
// buttons whose extra classes include "sm" (small) do not.
const btn = (label, onclick, x = '') => {
  const sm = x.includes('sm');
  return h('button', { class: 'btn ' + x, type: 'button', onclick },
    sm ? null : h('img', { class: 'flake flake-l', src: A + 'snow-left.svg', alt: '' }),
    h('span', {}, label),
    sm ? null : h('img', { class: 'flake flake-r', src: A + 'snow-right.svg', alt: '' })
  )
};

// Wraps an input or dropdown in the rounded "field" box.
const field = el => h('label', { class: 'field' }, el);

// Turns the date text typed by the organiser (e.g. "25 December 2026") into
// { month: 'Dec', day: '25th' } for the date badge. Handles several formats,
// and falls back to something sensible when it can't understand the text.
function formatDate(raw) {
  const fallback = { month: 'Dec', day: '25th' };

  // Empty text: use the fallback.
  if (!String(raw || '').trim()) return fallback;

  // Try the browser's own date parsing first...
  const parsed = new Date(raw), date = Number.isNaN(parsed.getTime()) ? null : parsed;

  // ...and also a pattern match for "25 Dec", "25th December" or "Dec 25".
  const match = String(raw).match(/(\d{1,2})(?:st|nd|rd|th)?(?:\s+([A-Za-z]+))?|([A-Za-z]+)\s+(\d{1,2})/);
  let dayNum, monthIndex;

  if (date && /[A-Za-z]/.test(raw) || (date && /^\d{4}-\d{2}-\d{2}/.test(raw))) {
    // The browser understood it (text with month names, or a yyyy-mm-dd date).
    dayNum = date.getDate();
    monthIndex = date.getMonth()
  }
  else if (match) {
    // Use the pattern match: find the month from its first 3 letters.
    const ms = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
    monthIndex = ms.indexOf((match[2] || match[3] || '').slice(0, 3).toLowerCase());
    dayNum = Number(match[1] || match[4]);
    // Unknown month word: just show the first 3 letters of what was typed.
    if (monthIndex < 0) return { month: raw.trim().slice(0, 3), day: '' }
  }
  // Nothing recognisable: show the first 8 characters as the "month".
  else return { month: raw.trim().slice(0, 8), day: '' };

  const M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  // English day suffix: 1st, 2nd, 3rd, 4th... (11th, 12th, 13th are special cases).
  const suf = (dayNum % 10 === 1 && dayNum !== 11) ? 'st'
            : (dayNum % 10 === 2 && dayNum !== 12) ? 'nd'
            : (dayNum % 10 === 3 && dayNum !== 13) ? 'rd'
            : 'th';

  return { month: M[monthIndex] || fallback.month, day: dayNum + suf }
}

// If the budget is just a number (e.g. "1000"), show it as ₹1,000.
// If it contains other text (e.g. "₹1,000 per person"), show it as typed.
const priceText = b => /^[\d,.\s]+$/.test(b) ? '₹' + Number(b.replace(/[^\d.]/g, '')).toLocaleString('en-IN') : b;

// The date badge: month on top, day number below, with string lights.
const dateBadge = raw => {
  const d = formatDate(raw);
  return h('div', { class: 'date-badge' }, lights('badge'), h('p', { class: 'month' }, d.month), h('p', { class: 'day' }, d.day))
};

// The price-cap banner shown on participant pages.
const capNote = b => h('div', { class: 'cap' }, lights('banner'), h('p', {}, 'Host has kept the price cap for this Secret Santa ' + priceText(b)));

// ----- The locked "Christmas Match" card (wrapped gift) -----
// Small icons drawn as SVG. They are fixed text written here (nothing typed by users),
// so it is safe to insert them into the page as HTML.
const LOCK_SVG = '<svg viewBox="0 0 32 32"><path d="M9.5 14v-4a6.5 6.5 0 0 1 13 0v4" fill="none" stroke="#e9b949" stroke-width="3"/><rect x="6" y="14" width="20" height="15" rx="3" fill="#e9b949"/><circle cx="16" cy="20.5" r="2.2" fill="#5a4300"/><rect x="15" y="21" width="2" height="4.5" rx="1" fill="#5a4300"/></svg>';

// A six-armed snowflake: one arm (a line with two little V-shaped branches) repeated at 0, 60 and 120 degrees.
const FLAKE_ARM = '<path d="M12 2v20M8.5 5L12 8l3.5-3M8.5 19L12 16l3.5 3"/>';
const FLAKE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
  + [0, 60, 120].map(deg => '<g transform="rotate(' + deg + ' 12 12)">' + FLAKE_ARM + '</g>').join('')
  + '</svg>';

// A small element that holds one of the SVG icons above.
const svgIcon = (cls, markup) => {
  const e = h('span', { class: cls, 'aria-hidden': 'true' });
  e.innerHTML = markup;
  return e
};

// The locked card: wrapped-gift picture on top (ribbons, lock badge, snowflakes),
// then "YOUR CHRISTMAS MATCH", a title and a line of small text.
// "title" and "text" are what change between the two situations (names not drawn yet / drawn but not revealed).
const wrappedCard = (title, text) => h('div', { class: 'wrapped' },
  h('div', { class: 'wrapped-top' },
    svgIcon('wflake wf1', FLAKE_SVG),
    svgIcon('wflake wf2', FLAKE_SVG),
    svgIcon('wflake wf3', FLAKE_SVG),
    svgIcon('wflake wf4', FLAKE_SVG),
    h('div', { class: 'ribbon-v' }),    // vertical ribbon
    h('div', { class: 'ribbon-h' }),    // horizontal ribbon
    svgIcon('wrapped-lock', LOCK_SVG)   // round lock badge in the middle
  ),
  h('div', { class: 'wrapped-body' },
    h('p', { class: 'wrap-kicker' }, 'Your Christmas Match'),
    h('p', { class: 'wrap-title' }, title),
    h('p', { class: 'wrap-sub' }, text)
  )
);

// One question + answer row, for the person you drew (same grey list-row style as before).
// The CSS keeps any line breaks the person typed in their answer.
const qaItem = (question, answer) => h('div', { class: 'pill' },
  h('div', { class: 'qa' },
    h('p', { class: 'qa-q' }, question),
    h('p', { class: 'qa-a' }, answer)
  )
);


// =====================================================================
// PARTICIPANT PAGE (what your friends see at the normal link)
// =====================================================================
async function participant() {
  app.className = '';   // normal narrow column

  // Load the public data: event settings, whether names are drawn, and the list of people.
  const pub = await api('public'),
        me = +localStorage.me,                              // id of the person chosen on this device (if any)
        who = pub.members.find(m => m.id === me),           // that person's record (undefined if none chosen)
        s = pub.settings;

  // Only show the date badge / price banner if the organiser filled them in.
  const hasDate = !!(s.date || '').trim(),
        hasBudget = !!(s.budget || '').trim();

  // ---------- Are we signed in? ----------
  // Signed in = a person is chosen, their PIN is saved on this device, and the server still accepts it.
  let signedIn = false, loginMessage = '';
  if (who && localStorage.pin) {
    try { await api('login', { body: { memberId: me, pin: localStorage.pin } }); signedIn = true }
    catch (e) {
      if (e.code === 'pin') delete localStorage.pin;   // the PIN was changed or reset: forget the old one
      loginMessage = e.code === 'pin' ? 'Your PIN has changed. Please enter the new one.' : e.message
    }
  }

  // ---------- Step 1: not signed in -> "Who are you?" + PIN screen ----------
  if (!signedIn) {
    // Dropdown listing everyone in the group (your previous choice is pre-selected, if any).
    const sel = h('select', { 'aria-label': 'Your name' },
      h('option', { value: '' }, 'Choose your name'),
      pub.members.map(m => h('option', Object.assign({ value: m.id }, m.id === me ? { selected: '' } : {}), m.name))
    );

    // The PIN box (dots instead of digits; number keypad on phones).
    const pinBox = h('input', { type: 'password', inputmode: 'numeric', autocomplete: 'off', maxlength: String(pub.pinLength), placeholder: 'Your PIN', 'aria-label': 'Your PIN' });

    // Check the name + PIN with the server. If correct, remember both on this device and open the home page.
    const login = guard(async () => {
      if (!sel.value) throw new Error('Choose your name first.');
      await api('login', { body: { memberId: +sel.value, pin: pinBox.value } });
      localStorage.me = sel.value;
      localStorage.pin = pinBox.value;
      participant()
    });
    pinBox.addEventListener('keydown', e => { if (e.key === 'Enter') login() });

    err.textContent = loginMessage;   // e.g. "Your PIN has changed..." after being sent back here

    app.replaceChildren(
      h('section', { class: 'screen welcome' },
        h('div', { class: 'stack gap-29' },
          art('santa', 'santa.webp'),

          // Event name on the left, date badge on the right.
          h('div', { class: 'headline-row' },
            h('h1', {}, s.name),
            hasDate ? dateBadge(s.date) : null
          ),

          // If there are participants: the name + PIN card and the sign-in button.
          // Otherwise: a "no one here yet" message.
          pub.members.length
            ? [
                h('div', { class: 'card card-pad stack gap-16' },
                  h('h2', {}, 'Who are you?'),
                  field(sel),
                  field(pinBox),
                  h('p', { class: 'waiting-copy', style: 'margin:0' }, 'Your organiser will have given you a ' + pub.pinLength + '-digit PIN.'),
                  err
                ),
                btn('Let’s Go', login)
              ]
            : h('div', { class: 'card waiting' },
                h('p', { class: 'waiting-title' }, 'No one here yet'),
                h('p', { class: 'waiting-copy' }, 'The organiser hasn’t added anyone yet. Check back soon.')
              ),

          hasBudget ? capNote(s.budget) : null
        )
      )
    );
    return
  }

  // ---------- Step 2: a person is chosen -> their home page ----------

  // ---------- Your own answers ----------
  // The questions come from the server (see QUESTIONS at the top of src/index.js),
  // so to change a question you only edit it there.
  const questions = pub.questions;

  // One text box per question, in the same order as the questions.
  const boxes = questions.map(q => h('textarea', { rows: '2', maxlength: '500', 'aria-label': q }));

  // A line that says "Saved!" after saving (cleared again as soon as you type something).
  const saved = h('p', { class: 'waiting-copy', role: 'status' });
  boxes.forEach(b => b.addEventListener('input', () => { saved.textContent = '' }));

  // Fetch your saved answers and fill them into the boxes.
  const loadAnswers = async () => {
    const a = await api('answers/' + me);
    a.forEach(x => { if (boxes[x.q]) boxes[x.q].value = x.answer })
  };

  // Save all the answers in one go.
  const save = guard(async () => {
    await api('answers', { body: { memberId: me, answers: boxes.map(b => b.value) } });
    saved.textContent = 'Saved!'
  });

  // ---------- Change my PIN ----------
  // Two boxes (new PIN + the same again to avoid typos) and the action behind the button.
  const pinAttrs = ph => ({ type: 'password', inputmode: 'numeric', autocomplete: 'off', maxlength: String(pub.pinLength), placeholder: ph, 'aria-label': ph });
  const np = h('input', pinAttrs('New PIN')),
        np2 = h('input', pinAttrs('Type the new PIN again'));

  // Shows "PIN changed!" (or the problem) right under the button.
  const pinMsg = h('p', { class: 'waiting-copy', role: 'status' });
  const changePin = async () => {
    pinMsg.className = 'waiting-copy';
    pinMsg.textContent = '';
    try {
      if (np.value !== np2.value) throw new Error('The two PINs don’t match.');
      // The server checks your current PIN (sent automatically) and then saves the new one.
      await api('pin', { body: { memberId: me, newPin: np.value } });
      localStorage.pin = np.value;   // keep this device signed in with the new PIN
      np.value = np2.value = '';
      pinMsg.textContent = 'PIN changed!'
    }
    catch (e) { pinMsg.className = 'err'; pinMsg.textContent = e.message }
  };

  // "match" holds either the waiting message, the reveal button, or the revealed person.
  const match = h('div', { class: 'stack gap-24' });

  // The "Not you?" button (forgets the chosen name and PIN on this device).
  // It is removed after you reveal who you drew, since switching identity then makes no sense.
  const notYou = h('button', { class: 'link', onclick: () => { delete localStorage.me; delete localStorage.pin; participant() } }, 'Not you?');

  // The white card with the gift box picture and "Your Christmas Match" caption.
  // "inner" is what goes under the caption (the reveal button or the person's name).
  const gift = (inner) => h('div', { class: 'card match' },
    art('gift', 'gift.webp'),
    h('div', { class: 'stack', style: 'width:100%' },
      h('p', { class: 'match-kicker' }, 'Your Christmas Match'),
      inner
    )
  );

  // What happens when you press "Reveal who I drew": ask the server, then show the
  // person's name and their answers (grey rows: question in small text, answer below).
  const reveal = guard(async () => {
    const a = await api('assignment/' + me);
    match.replaceChildren(
      gift(h('p', { class: 'match-name' }, a.name)),
      h('section', { class: 'card card-pad block stack gap-16' },
        art('deco snowman corner', 'snowman.webp'),
        h('h2', {}, a.name + '’s answers'),
        h('div', { class: 'stack gap-8' },
          a.answers.length
            ? a.answers.map(x => qaItem(x.question, x.answer))
            : h('p', { class: 'waiting-copy' }, 'They haven’t answered the questions yet. Check back later.')
        )
      )
    );

    // Revealed: remove the "Not you?" button from the page.
    notYou.remove()
  });

  // Names drawn but not revealed yet: the wrapped-gift card plus a "Reveal Now" button underneath.
  // Names not drawn yet: the same card with different text, and no button (there is nothing to reveal yet).
  if (pub.drawn) match.append(h('div', { class: 'stack gap-32' },
    wrappedCard('Still under wraps', 'A little Christmas mystery, picked just for you.'),
    btn('Reveal Now', reveal)
  ));
  else match.append(wrappedCard('Still in the hat', 'The draw hasn’t happened yet. Fill in your answers while you wait.'));

  // Put the whole page together.
  app.replaceChildren(
    h('section', { class: 'screen hub' },
      art('deco wreath date', 'wreath.webp'),               // wreath in the top-right corner
      h('h1', { class: 'title-narrow' }, s.name),           // event name

      // Greeting: "Hi <name>!" (name in bold) followed by the "Not you?" button.
      h('p', { class: 'lede greeting' },
        h('span', {}, 'Hi ', h('strong', {}, who.name), '!'),
        notYou
      ),

      // Date badge and price banner side by side (only the ones that are set).
      hasDate || hasBudget
        ? h('div', { class: 'info' }, hasDate ? dateBadge(s.date) : null, hasBudget ? capNote(s.budget) : null)
        : null,

      h('div', { class: 'stack gap-24', style: 'margin-top:24px' },
        err,      // error messages appear here
        match,    // waiting message / reveal button / revealed person

        // Your own answers: a labelled box for each question, and a Save button.
        h('section', { class: 'card card-pad block stack gap-16' },
          art('deco mistletoe corner', 'mistletoe.webp'),
          h('h2', {}, 'My answers'),
          h('div', { class: 'stack gap-16' },
            questions.map((q, i) =>
              h('div', { class: 'stack gap-8' },
                h('p', { class: 'qa-label' }, (i + 1) + '. ' + q),
                field(boxes[i])
              )
            ),
            h('div', { class: 'stack gap-8' },
              h('button', { class: 'add', type: 'button', onclick: save }, 'Save my answers'),
              saved
            )
          )
        ),

        // Change my PIN: as often as you like.
        h('section', { class: 'card card-pad stack gap-16' },
          h('h2', {}, 'Change my PIN'),
          h('p', { class: 'waiting-copy', style: 'margin:0' }, 'Pick a new ' + pub.pinLength + '-digit PIN. You’ll use it the next time you sign in on another device.'),
          field(np),
          field(np2),
          h('button', { class: 'add', type: 'button', onclick: changePin }, 'Change PIN'),
          pinMsg
        )
      ),

      art('wreath-bottom', 'wreath.webp')                   // wreath at the bottom of the page
    )
  );

  // Fetch and show your saved answers.
  guard(loadAnswers)()
}


// =====================================================================
// ORGANISER PAGE (the admin page at /#admin)
// =====================================================================
async function admin() {
  app.className = 'admin';   // slightly wider column for the forms

  // Page wrapper with the bauble decoration in the corner.
  const shell = (...c) => h('section', { class: 'screen' }, art('deco ornament corner', 'ornament.webp'), ...c);

  // ---------- Not logged in: show the password form ----------
  if (!localStorage.adminKey) {
    const k = h('input', { type: 'password', placeholder: 'Admin password', 'aria-label': 'Admin password' });
    app.replaceChildren(shell(
      h('h1', {}, 'Organiser login'),
      h('div', { class: 'card card-pad stack gap-16', style: 'margin-top:24px' },
        field(k),
        // Save the password in this browser, then reload the page (it is checked by the server on the next call).
        btn('Log in', () => { localStorage.adminKey = k.value; admin() }, 'sm'),
        err
      )
    ));
    return
  }

  // ---------- Logged in: load everything the organiser needs ----------
  // If the server rejects the saved password, forget it and show the login form again.
  let d;
  try { d = await api('admin') }
  catch (e) { delete localStorage.adminKey; err.textContent = e.message; return admin() }

  // nm = lookup of participant id -> name. re = reload this page.
  const nm = Object.fromEntries(d.members.map(m => [m.id, m.name])),
        re = () => admin();

  // a = wrap an admin action: run it, then reload the page, with errors shown via "guard".
  const a = fn => guard(async () => { await fn(); re() });

  // Inputs for the event details (pre-filled with the saved values).
  const sn = h('input', { value: d.settings.name, 'aria-label': 'Group name' }),
        sd = h('input', { value: d.settings.date, placeholder: 'Date, e.g. 25 Dec 2026', 'aria-label': 'Date' }),
        sb = h('input', { value: d.settings.budget, placeholder: 'Budget, e.g. ₹1,000', 'aria-label': 'Budget' });

  // Input for adding a participant.
  const mn = h('input', { placeholder: 'Participant name', 'aria-label': 'Participant name' }),
        mp = h('input', { type: 'text', inputmode: 'numeric', maxlength: String(d.pinLength), placeholder: 'Starting PIN', 'aria-label': 'Starting PIN' });

  // Dropdown options: a placeholder followed by every participant.
  const opts = ph => [h('option', { value: '' }, ph), ...d.members.map(m => h('option', { value: m.id }, m.name))];

  // Exclusion form controls: giver dropdown, "cannot draw" dropdown, and the "both ways" checkbox (ticked by default).
  const eg = h('select', { 'aria-label': 'Giver' }, opts('Giver')),
        er = h('select', { 'aria-label': 'Cannot draw' }, opts('Cannot draw')),
        eb = h('input', { type: 'checkbox', id: 'both', checked: '' });

  // A white card section; its children are passed in.
  const sec = (...c) => h('div', { class: 'card card-pad stack gap-16' }, ...c);

  app.replaceChildren(shell(
    h('div', { class: 'stack gap-24' },

      // ----- Title, the link to share with participants, and the error area -----
      h('div', {},
        h('h1', {}, 'Organiser'),
        h('p', { class: 'lede', style: 'word-break:break-all' }, 'Participant link: ' + location.origin + '/'),
        err
      ),

      // ----- Event details: name, date, budget, and a Save button -----
      sec(
        h('h2', {}, 'Event details'),
        h('div', { class: 'stack gap-8' },
          field(sn),
          field(sd),
          field(sb),
          h('div', {},
            btn('Save', a(() => api('admin/settings', { body: { name: sn.value, date: sd.value, budget: sb.value } })), 'sm')
          )
        )
      ),

      // ----- Participants: PIN buttons, × buttons (hidden after the draw) and an add form -----
      sec(
        h('h2', {}, 'Participants (' + d.members.length + ')'),
        h('p', { class: 'mute', style: 'margin:0' }, 'You choose each person’s PIN and tell them. Saved PINs can’t be shown again; use Reset PIN to pick a new one.'),
        h('div', { class: 'stack gap-8' },
          d.members.map(m => {
            // Hidden row for typing a new PIN for this person (opened by "Set PIN" / "Reset PIN").
            const newPin = h('input', { type: 'text', inputmode: 'numeric', maxlength: String(d.pinLength), placeholder: 'New PIN', 'aria-label': 'New PIN for ' + m.name });
            const pinRow = h('div', { class: 'row', style: 'display:none' },
              field(newPin),
              btn('Save PIN', a(() => api('admin/pin', { body: { memberId: m.id, pin: newPin.value } })), 'sm')
            );
            return h('div', { class: 'stack gap-8' },
              h('div', { class: 'pill' },
                h('span', {}, m.name, m.hasPin ? null : h('span', { class: 'mute' }, ' (no PIN yet)')),
                h('span', { class: 'row', style: 'flex-wrap:nowrap;gap:12px' },
                  h('button', { class: 'link', onclick: () => { pinRow.style.display = pinRow.style.display === 'none' ? 'flex' : 'none' } }, m.hasPin ? 'Reset PIN' : 'Set PIN'),
                  d.drawn ? null : h('button', { class: 'x', 'aria-label': 'Remove ' + m.name, onclick: a(() => api('admin/members/' + m.id, { method: 'DELETE' })) }, '×')
                )
              ),
              pinRow
            )
          })
        ),
        d.drawn ? null : h('div', { class: 'row' },
          field(mn),
          field(mp),
          btn('Add', a(() => api('admin/members', { body: { name: mn.value, pin: mp.value } })), 'sm')
        )
      ),

      // ----- Exclusions: list with × buttons and a form to add "X can't draw Y" -----
      sec(
        h('h2', {}, 'Exclusions (only you can see these)'),
        h('div', { class: 'stack gap-8' },
          d.exclusions.map(x =>
            h('div', { class: 'pill' },
              nm[x.giver] + ' can’t draw ' + nm[x.receiver],
              h('button', { class: 'x', 'aria-label': 'Remove exclusion', onclick: a(() => api('admin/exclusions/' + x.giver + '/' + x.receiver, { method: 'DELETE' })) }, '×')
            )
          )
        ),
        d.drawn ? null : h('div', { class: 'row' },
          field(eg),
          field(er),
          h('label', { class: 'chk' }, eb, 'Both ways'),
          btn('Add', a(() => api('admin/exclusions', { body: { giver: eg.value, receiver: er.value, both: eb.checked } })), 'sm')
        )
      ),

      // ----- Draw names / Reset draw -----
      sec(
        h('h2', {}, 'Draw names'),
        d.drawn
          // Already drawn: explain, and offer a (confirmed) reset.
          ? [
              h('p', { class: 'mute', style: 'margin:0' }, 'Names are drawn and locked. Participants can now reveal who they drew.'),
              btn('Reset draw', a(async () => { if (confirm('This erases the current draw for everyone. Continue?')) await api('admin/reset', { method: 'POST', body: {} }) }), 'sm danger')
            ]
          // Not drawn yet: offer the big "Draw names" button.
          : [
              h('p', { class: 'mute', style: 'margin:0' }, 'You won’t see who drew whom, so you can play too.'),
              btn('Draw names', a(() => api('admin/draw', { body: {} })))
            ]
      )
    )
  ));
}


// =====================================================================
// START-UP: the page address decides which page to show
// =====================================================================

// "/#admin" shows the organiser page; anything else shows the participant page.
location.hash === '#admin' ? admin() : participant();

// If the part after # changes, reload the page so the right view is shown.
window.addEventListener('hashchange', () => location.reload());
</script></body></html>
